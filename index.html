<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.webmanifest"><title>ReelBox</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mu:#8b92a1;--ac:#7c5cff;--bd:#2a2e38}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f9;--card:#fff;--tx:#161922;--mu:#6b7280;--bd:#e3e6ec}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;background:var(--bg);padding:10px 12px;z-index:5;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
input[type=search]{flex:1;min-width:0}button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:20px;padding:6px 12px;font-size:13px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.filters{display:flex;gap:6px;margin-top:8px;font-size:13px;flex-wrap:wrap;align-items:center}.filters input{padding:6px}
main{padding:10px 12px;display:grid;gap:10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.it .t{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu)}
.it .u{font-weight:600;margin:6px 0 2px}.it .c{color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.it .a{display:flex;gap:6px;margin-top:10px;align-items:center}.it a{color:var(--ac);text-decoration:none;font-weight:600;margin-right:auto}
.it select{padding:5px;font-size:13px}.it button{padding:5px 9px}
.th{width:110px;height:150px;flex:none;border-radius:10px;overflow:hidden;background:var(--bd);display:grid;place-items:center;font-size:24px;text-decoration:none}.th img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
#ov{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;z-index:20;padding:20px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;max-width:420px;width:92%}
dialog h3{margin:0 0 8px}dialog label{display:block;margin:12px 0 4px;color:var(--mu);font-size:13px}dialog input{width:100%}
dialog .b{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
</style></head><body>
<div id="ov"><div><div id="ovi" style="font-size:44px">⏳</div><div id="ovt" style="margin-top:8px;font-size:17px">Saving…</div></div></div>
<header>
<div class="row"><input type="search" id="q" placeholder="Search caption, user, date (e.g. 2026-10)…"><button id="sort" title="Sort">↓ New</button><button id="set">⚙</button></div>
<div class="chips" id="chips"></div>
<div class="filters">From <input type="date" id="from"> To <input type="date" id="to"><button id="clr">Clear</button><span id="cnt" style="margin-left:auto;color:var(--mu)"></span></div>
</header>
<main id="list"></main>
<dialog id="dlg"><h3>Settings</h3>
<label>Groq API key (optional, for smarter AI sorting)</label><input id="key" type="password" placeholder="gsk_…">
<label>Worker URL (caption aur thumbnail ke liye)</label><input id="wk" placeholder="https://xxxx.workers.dev"><div class="b"><button class="p" id="auto">Auto-sort Unsorted</button><button id="addc">+ Category</button><button id="delc">− Category</button></div>
<label>Import Instagram export (saved_posts.json / liked_posts.json)</label><input type="file" id="imp" accept=".json" multiple>
<div class="b"><button id="exp">Backup (download)</button><button id="rst">Restore backup</button><input type="file" id="rf" accept=".json" hidden></div>
<div id="msg" style="margin-top:10px;color:var(--mu);font-size:13px"></div>
<div class="b"><button class="p" id="cl">Close</button></div></dialog>
<script>
const KW={Coding:['code','coding','python','javascript','react','developer','programming','github','api','html','css','leetcode','dsa','software','webdev','sql','linux','frontend','backend'],Trading:['trading','stock','stocks','nifty','banknifty','crypto','bitcoin','options','forex','invest','investing','sharemarket','finance','mutual','candlestick','intraday'],Music:['song','music','lyrics','guitar','singer','beats','remix','playlist','rap','piano','audio','cover'],'Useful Apps':['app','apps','tool','tools','chatgpt','productivity','free tool','ai tool','android','iphone'],Websites:['website','websites','site','sites','.com','.io','domain','link in bio'],Study:['study','exam','neet','jee','upsc','notes','student','physics','chemistry','maths','learn','education','ssc','gate','board'],Funny:['funny','comedy','meme','lol','joke','roast','humor','haha','😂','🤣'],Emotional:['love','sad','heart','breakup','emotional','motivation','motivational','feelings','pain','quotes','shayari','💔','😢']};
let S={items:[],cats:['Coding','Trading','Music','Useful Apps','Websites','Study','Funny','Emotional'],key:'',w:'',cat:'All',sort:'new',q:'',from:'',to:''};
const $=id=>document.getElementById(id);
try{const d=JSON.parse(localStorage.getItem('reelbox')||'null');if(d)Object.assign(S,d,{cat:'All',q:'',from:'',to:''})}catch(e){}
function save(){try{localStorage.setItem('reelbox',JSON.stringify({items:S.items,cats:S.cats,key:S.key,w:S.w,sort:S.sort}))}catch(e){}}
const norm=u=>{try{const x=new URL(u);return x.origin+x.pathname.replace(/\/$/,'')}catch(e){return u}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'No date';
function add(url,ts,user,src,bump){const id=norm(url);const old=S.items.find(i=>i.id===id);
 if(old&&!bump)return old;
 if(old)S.items=S.items.filter(i=>i!==old);
 const it=old?{...old,ts:Date.now(),src}:{id,url:id,ts:ts||Date.now(),user:user||'',caption:'',cat:'Unsorted',src,tried:false};
 S.items.push(it);return it}
const DEFW='https://snowy-surf-f533.mayanksank-3055.workers.dev';
const prox=(u,img)=>[(S.w||DEFW)+'?'+(img?'i=':'u=')+encodeURIComponent(u)];
let LAST='';
async function px(u){for(const p of prox(u)){for(let n=0;n<3;n++){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),9000);const r=await fetch(p,{signal:c.signal});clearTimeout(t);LAST+='w'+r.status+' ';if(r.ok){const x=await r.text();if(x.length>200)return x}if(r.status!==429)break;await new Promise(s=>setTimeout(s,1500*(n+1)))}catch(e){LAST+='werr ';break}}}return''}
async function pxb(u){for(const p of prox(u,1)){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);const r=await fetch(p,{signal:c.signal});clearTimeout(t);if(r.ok){const b=await r.blob();if(b.size>500)return b}}catch(e){}}return null}
async function thumb(u){try{const b=await pxb(u);if(!b)return'';const im=new Image();const url=URL.createObjectURL(b);await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});const w=180,hh=Math.round(im.height*w/im.width);const c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(im,0,0,w,hh);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.55)}catch(e){return''}}
async function cap(url){
 LAST='';let c='',u='',i='';const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
 const g=await px(url.replace(/\/?$/,'/'));
 if(g){const mt=k=>{const m=g.match(new RegExp('property="'+k+'"\\s+content="([^"]*)"'))||g.match(new RegExp('content="([^"]*)"\\s+property="'+k+'"'));return m?dec(m[1]):''};
  const d=mt('og:description'),t=mt('og:title');i=mt('og:image');
  const m1=d.match(/:\s*"([\s\S]*)"\.?\s*$/)||t.match(/:\s*"([\s\S]*)"\s*$/);
  c=(m1?m1[1]:'').slice(0,400);
  if(!c&&d&&!/likes|comments/i.test(d))c=d.slice(0,400);
  const um=t.match(/^(.*?) on Instagram/)||d.match(/- ([\w.]+) on /);u=um?um[1].trim():''}
 if(!c||!i){const h=await px(url.replace(/\/?$/,'/')+'embed/captioned/');
  if(h){const dd=new DOMParser().parseFromString(h,'text/html');
   if(!c){const e=dd.querySelector('.Caption');if(e){const x=e.cloneNode(true);x.querySelectorAll('.CaptionUsername,.CaptionComments').forEach(k=>k.remove());c=x.textContent.trim().slice(0,400)}}
   if(!i){const im=dd.querySelector('img.EmbeddedMediaImage');if(im)i=im.getAttribute('src')||''}}}
 return{c,u,i,d:LAST}}
function kw(t){t=t.toLowerCase();let b='Unsorted',n=0;for(const c of Object.keys(KW)){if(!S.cats.includes(c))continue;let s=0;KW[c].forEach(k=>{if(t.includes(k))s++});if(s>n){n=s;b=c}}return b}
async function ai(t){try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.key},body:JSON.stringify({model:'llama-3.1-8b-instant',temperature:0,max_tokens:10,messages:[{role:'system',content:'Classify an Instagram reel into exactly one of: '+S.cats.join(', ')+'. Reply with only the category name. If unclear reply Unsorted.'},{role:'user',content:t}]})});
 const a=((await r.json()).choices?.[0]?.message?.content||'').toLowerCase();return S.cats.find(c=>a.includes(c.toLowerCase()))||kw(t)}catch(e){return kw(t)}}
async function sortOne(it){if(!it.caption||!it.img){const r=await cap(it.url);if(r.c&&!it.caption)it.caption=r.c;if(!r.c)it.dbg=r.d.slice(0,30);if(r.u&&!it.user)it.user=r.u;if(r.i&&!it.img)it.img=await thumb(r.i)}
 const t=(it.caption+' '+it.user).trim();
 if(it.caption&&!it.tried){it.cat=S.key?await ai(t):kw(t);it.tried=true}save()}
function view(){let a=S.items.filter(i=>(S.cat==='All'||i.cat===S.cat));const q=S.q.toLowerCase();
 if(q)a=a.filter(i=>(i.caption+' '+i.user+' '+i.cat+' '+i.url+' '+new Date(i.ts).toISOString().slice(0,10)+' '+fd(i.ts)).toLowerCase().includes(q));
 if(S.from)a=a.filter(i=>i.ts>=new Date(S.from).getTime());if(S.to)a=a.filter(i=>i.ts<=new Date(S.to).getTime()+864e5);
 a.sort((x,y)=>S.sort==='new'?y.ts-x.ts:x.ts-y.ts);
 const all=['All',...S.cats,'Unsorted'];const cnt=c=>c==='All'?S.items.length:S.items.filter(i=>i.cat===c).length;
 $('chips').innerHTML=all.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-c="${esc(c)}">${esc(c)} ${cnt(c)}</button>`).join('');
 $('sort').textContent=S.sort==='new'?'↓ New':'↑ Old';$('cnt').textContent=a.length+' reels';
 $('list').innerHTML=a.length?a.slice(0,300).map(i=>`<div class="it"><div style="display:flex;gap:10px"><a class="th" href="${esc(i.url)}" target="_blank" rel="noopener">${i.img?`<img src="${i.img}">`:'🎬'}</a><div style="flex:1;min-width:0"><div class="t"><span>${fd(i.ts)} · ${i.src}</span><span>${esc(i.cat)}</span></div><div class="u">${i.user?'@'+esc(i.user):'Reel'}</div><div class="c">${esc(i.caption)||('No caption yet'+(i.dbg?' ['+esc(i.dbg)+']':''))}</div>
 <div class="a"><a href="${esc(i.url)}" target="_blank" rel="noopener">Open ↗</a><select data-id="${esc(i.id)}">${['Unsorted',...S.cats].map(c=>`<option ${c===i.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><button data-cp="${esc(i.id)}">✎</button><button data-d="${esc(i.id)}">🗑</button></div></div></div></div>`).join(''):'<div class="empty">Kuch nahi mila. Instagram se reel share karo ya export import karo.</div>'}
$('chips').onclick=e=>{const c=e.target.dataset.c;if(c){S.cat=c;view()}};
$('list').onchange=e=>{const i=S.items.find(x=>x.id===e.target.dataset.id);if(i){i.cat=e.target.value;i.tried=true;save();view()}};
$('list').onclick=e=>{const cp=e.target.dataset.cp;if(cp){const i=S.items.find(x=>x.id===cp);const t=prompt('Caption paste karo:',i.caption||'');if(t){i.caption=t.slice(0,400);(async()=>{const q=i.caption+' '+i.user;i.cat=S.key?await ai(q):kw(q);i.tried=true;save();view()})()}return}const d=e.target.dataset.d;if(d&&confirm('Delete?')){S.items=S.items.filter(i=>i.id!==d);save();view()}};
$('q').oninput=e=>{S.q=e.target.value;view()};$('from').onchange=e=>{S.from=e.target.value;view()};$('to').onchange=e=>{S.to=e.target.value;view()};
$('clr').onclick=()=>{S.q=S.from=S.to='';$('q').value=$('from').value=$('to').value='';view()};
$('sort').onclick=()=>{S.sort=S.sort==='new'?'old':'new';save();view()};
$('set').onclick=()=>{$('key').value=S.key;$('wk').value=S.w;$('dlg').showModal()};$('cl').onclick=()=>{S.key=$('key').value.trim();S.w=$('wk').value.trim().replace(/\/$/,'');save();$('dlg').close()};
$('delc').onclick=()=>{const n=(prompt('Kaunsi category delete karni hai?\n'+S.cats.join(', '))||'').trim();const c=S.cats.find(x=>x.toLowerCase()===n.toLowerCase());if(!c)return;if(!confirm(c+' delete karu? Iski reels Unsorted me chali jayengi.'))return;S.cats=S.cats.filter(x=>x!==c);S.items.forEach(i=>{if(i.cat===c)i.cat='Unsorted'});if(S.cat===c)S.cat='All';save();view()};
$('addc').onclick=()=>{const n=(prompt('New category name?')||'').trim();if(n&&!S.cats.includes(n)){S.cats.push(n);save();view()}};
$('auto').onclick=async()=>{S.key=$('key').value.trim();S.w=$('wk').value.trim().replace(/\/$/,'');S.items.forEach(i=>{if(i.cat==='Unsorted'&&i.caption)i.tried=false});const l=S.items.filter(i=>(i.cat==='Unsorted'&&!i.tried)||!i.img);let n=0;
 for(const it of l){$('msg').textContent='Sorting '+(++n)+'/'+l.length+'…';await sortOne(it);view();await new Promise(r=>setTimeout(r,2500))}$('msg').textContent='Done ✓'};
function walk(o,out,t){if(Array.isArray(o))o.forEach(x=>walk(x,out,t));else if(o&&typeof o=='object'){if(typeof o.href=='string'&&/instagram\.com/.test(o.href))out.push({url:o.href,ts:(o.timestamp||0)*1000,user:t||''});const tt=typeof o.title=='string'&&o.title?o.title:t;for(const k in o)walk(o[k],out,tt)}}
$('imp').onchange=async e=>{let n=0;for(const f of e.target.files){try{const out=[];walk(JSON.parse(await f.text()),out,'');const src=/like/i.test(f.name)?'liked':'saved';
 out.forEach(x=>{if(!/\/(reel|reels|p|tv)\//.test(x.url))return;const b=S.items.length;add(x.url,x.ts,x.user,src);if(S.items.length>b)n++})}catch(er){}}
 save();view();$('msg').textContent=n+' naye items import hue. Ab "Auto-sort Unsorted" dabao.'};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.items.length?{items:S.items,cats:S.cats}:{})],{type:'application/json'}));a.download='reelbox-backup.json';a.click()};
$('rst').onclick=()=>$('rf').click();
$('rf').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());(d.cats||[]).forEach(c=>{if(!S.cats.includes(c))S.cats.push(c)});(d.items||[]).forEach(i=>{if(!S.items.find(x=>x.id===i.id))S.items.push(i)});save();view();$('msg').textContent='Restored ✓'}catch(er){$('msg').textContent='Bad file'}};
(async function(){S.items.forEach(i=>{if(i.cat==='Unsorted'&&i.caption){const c=kw(i.caption+' '+i.user);if(c!=='Unsorted')i.cat=c}});save();view();
 const p=new URLSearchParams(location.search);const raw=[p.get('url'),p.get('text'),p.get('title')].join(' ');const m=raw.match(/https?:\/\/(www\.)?instagram\.com\/[^\s]+/);
 if(m){$('ov').style.display='grid';const dup=S.items.some(i=>i.id===norm(m[0]));const it=add(m[0],Date.now(),'','share',true);save();if(!it.tried)await sortOne(it);
  $('ovi').textContent=dup?'🔁':'✅';$('ovt').textContent=(dup?'Already saved, moved to top in ':'Saved in ')+it.cat;history.replaceState(null,'',location.pathname);
  setTimeout(()=>{window.close();setTimeout(()=>{$('ov').style.display='none';view()},400)},1200)}
 async function bg(){for(const it of S.items.filter(i=>(!i.caption||!i.img)&&(i.n||0)<6)){it.n=(it.n||0)+1;await sortOne(it);view();await new Promise(r=>setTimeout(r,6000))}}
 if(!m)setTimeout(bg,2000);
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
